<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Flashcards — 练</title>
<meta name="description" content="The full HSK 1–6 flashcard deck: 4,993 words with pinyin, meaning and an example sentence. Spaced repetition, audio, works offline.">
<meta name="theme-color" content="#22223B">
<meta name="color-scheme" content="dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Crect width=%22100%22 height=%22100%22 rx=%2220%22 fill=%22%2322223B%22/%3E%3Crect x=%2218%22 y=%2234%22 width=%2228%22 height=%2228%22 rx=%226%22 fill=%22%23B8F3FF%22/%3E%3Crect x=%2254%22 y=%2234%22 width=%2228%22 height=%2228%22 rx=%226%22 fill=%22%238ABCAD%22/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
/* page-specific: the card itself */
.card{
  width:min(680px,100%);background:var(--paper);color:var(--on-paper);
  border-radius:var(--r);padding:34px 28px 26px;text-align:center;cursor:pointer;
  box-shadow:0 20px 44px -26px rgba(0,0,0,.75);
  min-height:330px;display:flex;flex-direction:column;justify-content:center;position:relative;
}
.seal{
  position:absolute;top:15px;right:15px;padding:4px 9px;border-radius:7px;
  background:color-mix(in srgb,var(--rose) 26%,transparent);
  color:#A8604F;font-size:12px;font-weight:600;letter-spacing:.04em;
}
.face{font-family:var(--han);font-size:clamp(52px,12vw,84px);font-weight:500;line-height:1.15;word-break:break-word}
.face.long{font-size:clamp(38px,8vw,58px)}
.cue{font-size:clamp(22px,5vw,30px);line-height:1.4;padding:0 6px}
.hint{font-size:14px;color:var(--on-paper-soft);margin-top:16px}
.pin{font-size:20px;color:#4F8275;margin-top:14px;letter-spacing:.02em}
.gloss{font-size:20px;margin-top:7px}
.rule{height:1px;background:var(--rail);margin:20px 0 15px}
.ex{text-align:left}
.ex .zh{font-size:21px;line-height:1.75}
.ex .py{font-size:14.5px;color:#4F8275;margin-top:4px}
.ex .en{font-size:14.5px;color:var(--on-paper-soft);margin-top:2px}
.hear{
  display:inline-flex;align-items:center;gap:7px;margin-top:14px;min-height:40px;
  padding:9px 15px;border-radius:999px;border:1.5px solid var(--rail);
  color:var(--on-paper-soft);font-size:14px;
}
.hear:hover{border-color:var(--sage);color:#4F8275}

.grade{display:flex;gap:8px;width:min(680px,100%)}
.grade button{
  flex:1;min-height:var(--tap);padding:13px 6px;border-radius:11px;
  font-size:14.5px;font-weight:600;color:var(--paper);
  background:var(--ink-2);border:1px solid var(--ink-line);
  transition:border-color .14s,color .14s,background .14s;
}
.grade button:hover{background:var(--ink-3)}
.grade button[data-g="0"]:hover{border-color:var(--rose);color:var(--rose)}
.grade button[data-g="3"]:hover{border-color:var(--sage);color:var(--sage)}
.grade kbd{display:block;font-size:11px;opacity:.5;font-weight:400;margin-top:2px}

.meter{width:min(680px,100%);height:3px;background:var(--ink-2);border-radius:3px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--sage);width:0;transition:width .3s}
.stats{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:14px;opacity:.6}
.stats b{color:var(--ice);font-weight:600}

.search{
  width:100%;padding:13px 15px;border-radius:11px;margin:16px 0;
  background:var(--ink-2);border:1px solid var(--ink-line);color:var(--paper);font-size:16px;
}
.search::placeholder{color:var(--paper);opacity:.45}
.row{display:grid;grid-template-columns:92px 1fr;gap:15px;padding:14px 0;border-bottom:1px solid var(--ink-line)}
.row .h{font-family:var(--han);font-size:27px;line-height:1.2}
.row .p{font-size:12.5px;color:var(--sage)}
.row .m{font-size:15px}
.row .s{font-family:var(--han);font-size:15px;opacity:.55;margin-top:4px}
.row .t{font-size:12.5px;opacity:.4}
.count{font-size:14px;opacity:.5;padding-top:12px}
.list{width:min(900px,100%)}
@media (max-width:700px){ .card{padding:26px 18px 20px;min-height:290px} }
@media (max-width:420px){ .grade button{font-size:13px;padding:11px 3px} }
</style>
</head>
<body>

<noscript><p style="padding:24px">This page needs JavaScript enabled.</p></noscript>

<header class="bar">
  <a class="brand" href="index.html" aria-label="Back to practice"><span class="z">练</span><span class="n">flashcards</span></a>
  <span class="bar-sp"></span>
  <nav class="lvl" id="lvl" aria-label="HSK level"></nav>
  <nav class="lvl" aria-label="View">
    <button id="tStudy" aria-pressed="true">Study</button>
    <button id="tList" aria-pressed="false">Word list</button>
  </nav>
</header>

<main class="stage" id="main"></main>

<script src="data/vocab.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const main = $('main');
const el = (t, c, h) => { const n = document.createElement(t); if (c) n.className = c; if (h !== undefined) n.innerHTML = h; return n; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const DECK = Array.isArray(window.VOCAB) ? window.VOCAB : [];

const KEY = 'lian-cards-v1';
const S = { level: 'all', dir: 'rec', flipped: false, queue: [], cur: null, seen: 0, streak: 0, best: {}, view: 'study' };
let store = true;
try { localStorage.setItem('__t', '1'); localStorage.removeItem('__t'); } catch (e) { store = false; }
function save() { if (!store) return; try { localStorage.setItem(KEY, JSON.stringify({ best: S.best, seen: S.seen, level: S.level, dir: S.dir })); } catch (e) { store = false; } }
function load() {
  if (!store) return;
  try { const d = JSON.parse(localStorage.getItem(KEY) || '{}'); S.best = d.best || {}; S.seen = d.seen || 0; if (d.level) S.level = d.level; if (d.dir) S.dir = d.dir; } catch (e) { }
}

/* audio: the device's own Chinese voice, if it has one */
let zhVoice = null;
function findVoice() {
  if (!('speechSynthesis' in window)) return;
  const vs = speechSynthesis.getVoices();
  const zh = vs.filter(v => /^zh/i.test(v.lang) || /chinese|mandarin/i.test(v.name));
  zhVoice = zh.find(v => /zh[-_]?CN/i.test(v.lang)) || zh[0] || null;
}
findVoice();
if ('speechSynthesis' in window) { speechSynthesis.onvoiceschanged = findVoice; setTimeout(findVoice, 600); }
function say(text) {
  if (!zhVoice) return false;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.voice = zhVoice; u.lang = zhVoice.lang || 'zh-CN'; u.rate = .85;
  speechSynthesis.speak(u); return true;
}

const pool = () => DECK.filter(w => S.level === 'all' || w.l === +S.level);
function buildQueue() {
  const p = pool().slice().sort((a, b) => {
    const sa = S.best[a.h] ?? -1, sb = S.best[b.h] ?? -1;
    return sa !== sb ? sa - sb : Math.random() - .5;
  });
  S.queue = p; next();
}
function next() { S.flipped = false; S.cur = S.queue.shift() || null; render(); }

function render() {
  if (S.view === 'list') return renderList();
  main.innerHTML = '';
  const stats = el('div', 'stats');
  const total = pool().length;
  stats.innerHTML = `<span>${(S.queue.length + (S.cur ? 1 : 0)).toLocaleString()} left</span>`
    + `<span>${S.seen.toLocaleString()} reviewed</span>`
    + `<span>streak <b>${S.streak}</b></span>`;
  main.appendChild(stats);

  const card = el('div', 'card');
  card.tabIndex = 0;
  card.setAttribute('role', 'button');
  if (!S.cur) {
    card.style.cursor = 'default';
    card.innerHTML = `<div><div class="face" style="font-size:40px">做得好</div>
      <p class="hint">Deck finished. Shuffle to run through it again.</p></div>`;
    main.appendChild(card);
    const c = el('div', 'ctrl');
    c.appendChild(mkBtn('Shuffle deck', shuffleDeck));
    main.appendChild(c);
    return;
  }
  const w = S.cur, rec = S.dir === 'rec';
  card.appendChild(el('span', 'seal', 'HSK ' + w.l));

  const front = el('div');
  if (rec) front.innerHTML = `<div class="face${w.h.length > 3 ? ' long' : ''} zh">${esc(w.h)}</div>`;
  else front.innerHTML = `<div class="cue">${esc(w.m)}</div><p class="hint">Say it out loud, then reveal</p>`;
  card.appendChild(front);

  if (S.flipped) {
    const back = el('div');
    back.innerHTML = rec
      ? `<div class="pin">${esc(w.p)}</div><div class="gloss">${esc(w.m)}</div>`
      : `<div class="face${w.h.length > 3 ? ' long' : ''} zh">${esc(w.h)}</div><div class="pin">${esc(w.p)}</div>`;
    back.innerHTML += `<div class="rule"></div>
      <div class="ex"><div class="zh">${esc(w.s)}</div><div class="py">${esc(w.sp)}</div><div class="en">${esc(w.st)}</div></div>`;
    const hear = el('button', 'hear', '▶ Hear it');
    hear.onclick = e => { e.stopPropagation(); if (!say(w.h + '。' + w.s)) hear.textContent = 'No Chinese voice on this device'; };
    back.appendChild(hear);
    card.appendChild(back);
  }
  card.onclick = () => { if (!S.flipped) { S.flipped = true; render(); } };
  card.onkeydown = e => { if (e.key === 'Enter' && !S.flipped) { S.flipped = true; render(); } };
  main.appendChild(card);

  const meter = el('div', 'meter', '<i></i>');
  meter.firstChild.style.width = (100 * (total - S.queue.length - 1) / Math.max(total, 1)) + '%';
  main.appendChild(meter);

  if (!S.flipped) {
    const c = el('div', 'ctrl');
    c.appendChild(mkBtn('Reveal answer', () => { S.flipped = true; render(); }));
    main.appendChild(c);
  } else {
    const g = el('div', 'grade');
    [['Again', 0], ['Hard', 1], ['Good', 2], ['Easy', 3]].forEach(([label, n]) => {
      const b = el('button', null, `${label}<kbd>${n + 1}</kbd>`);
      b.dataset.g = n;
      b.onclick = () => grade(n);
      g.appendChild(b);
    });
    main.appendChild(g);
  }

  const foot = el('div', 'ctrl');
  foot.appendChild(mkBtn('Shuffle', shuffleDeck, true));
  foot.appendChild(mkBtn('Reset progress', () => {
    if (!confirm('Reset flashcard progress? This cannot be undone.')) return;
    S.best = {}; S.seen = 0; S.streak = 0;
    if (store) try { localStorage.removeItem(KEY); } catch (e) { }
    buildQueue();
  }, true));
  foot.appendChild(mkBtn('Direction: ' + (rec ? '汉 → EN' : 'EN → 汉'), () => { S.dir = rec ? 'rcl' : 'rec'; save(); render(); }, true));
  main.appendChild(foot);
}
function mkBtn(label, fn, quiet) { const b = el('button', 'btn' + (quiet ? ' quiet' : ''), label); b.onclick = fn; return b; }

function grade(g) {
  const w = S.cur; if (!w) return;
  S.best[w.h] = g; S.seen++; S.streak = g === 0 ? 0 : S.streak + 1;
  if (g === 0) S.queue.splice(Math.min(3, S.queue.length), 0, w);
  else if (g === 1) S.queue.splice(Math.min(9, S.queue.length), 0, w);
  else if (g === 2) S.queue.splice(Math.min(40, S.queue.length), 0, w);
  save(); next();
}
function shuffleDeck() { S.queue = pool().slice().sort(() => Math.random() - .5); next(); }

function renderList(q) {
  main.innerHTML = '';
  const box = el('div', 'list');
  const inp = el('input', 'search');
  inp.type = 'search';
  inp.placeholder = 'Search character, pinyin or meaning…';
  inp.setAttribute('aria-label', 'Search the deck');
  inp.value = q || '';
  box.appendChild(inp);
  const count = el('div', 'count');
  const body = el('div');
  box.appendChild(count); box.appendChild(body);
  main.appendChild(box);

  const draw = term => {
    const t = (term || '').trim().toLowerCase();
    const rows = pool().filter(w => !t || w.h.includes(t) || w.p.toLowerCase().includes(t) || w.m.toLowerCase().includes(t));
    const cap = 300, shown = rows.slice(0, cap);
    count.textContent = rows.length.toLocaleString() + ' words' + (rows.length > cap ? ` — showing first ${cap}, search to narrow` : '');
    body.innerHTML = shown.map(w =>
      `<div class="row"><div class="h zh">${esc(w.h)}<div class="p">${esc(w.p)}</div></div>
       <div><div class="m">${esc(w.m)}</div><div class="s zh">${esc(w.s)}</div>
       <div class="t">${esc(w.sp)} — ${esc(w.st)}</div></div></div>`).join('');
  };
  draw(inp.value);
  inp.oninput = e => draw(e.target.value);
  if (q === undefined) setTimeout(() => inp.focus(), 40);
}

/* level + view chrome */
const nav = $('lvl');
[['all', 'All'], ['1', 'HSK 1'], ['2', 'HSK 2'], ['3', 'HSK 3'], ['4', 'HSK 4'], ['5', 'HSK 5'], ['6', 'HSK 6']].forEach(([v, label]) => {
  const b = el('button', null, label);
  b.dataset.l = v;
  b.setAttribute('aria-pressed', v === S.level);
  b.onclick = () => {
    S.level = v; save();
    [...nav.children].forEach(c => c.setAttribute('aria-pressed', c.dataset.l === v));
    S.view === 'list' ? renderList() : buildQueue();
  };
  nav.appendChild(b);
});
function setView(v) {
  S.view = v;
  $('tStudy').setAttribute('aria-pressed', v === 'study');
  $('tList').setAttribute('aria-pressed', v === 'list');
  v === 'list' ? renderList() : render();
}
$('tStudy').onclick = () => setView('study');
$('tList').onclick = () => setView('list');

addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || S.view !== 'study') return;
  if (e.code === 'Space') { e.preventDefault(); S.flipped ? grade(2) : (S.flipped = true, render()); }
  else if (['1', '2', '3', '4'].includes(e.key) && S.flipped) grade(+e.key - 1);
  else if (e.key === 's' && S.cur) say(S.cur.h);
});

load();
[...nav.children].forEach(c => c.setAttribute('aria-pressed', c.dataset.l === S.level));
buildQueue();

if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => { }));
}
</script>
</body>
</html>
